
name: Build SONORA Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: spotify-premium-main

    steps:
      - name: Télécharger SONORA
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier la structure du projet
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            Write-Error "package.json est introuvable dans spotify-premium-main."
            exit 1
          }

          if (!(Test-Path "electron/main.cjs")) {
            Write-Error "electron/main.cjs est introuvable."
            exit 1
          }

          if (!(Test-Path "next.config.js")) {
            Write-Error "next.config.js est introuvable."
            exit 1
          }

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier Electron
        run: npm ls electron electron-builder

      - name: Construire Next.js
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Vérifier le serveur autonome
        shell: pwsh
        run: |
          if (!(Test-Path ".next/standalone/server.js")) {
            Write-Error "Le serveur Next.js autonome est absent."
            exit 1
          }

      - name: Vérifier le fichier Electron
        shell: pwsh
        run: |
          if (!(Test-Path "electron/main.cjs")) {
            Write-Error "Le fichier Electron est absent."
            exit 1
          }

      - name: Construire SONORA Windows
        run: npx electron-builder --win nsis --x64

      - name: Vérifier l'installateur
        shell: pwsh
        run: |
          if (!(Test-Path "release")) {
            Write-Error "Le dossier release est absent."
            exit 1
          }

          $installer = Get-ChildItem "release" -Filter "*.exe" -File

          if (!$installer) {
            Write-Error "Aucun installateur EXE n'a été généré."
            exit 1
          }

          Write-Host "Installateur généré :"
          $installer | ForEach-Object { Write-Host $_.FullName }

      - name: Publier SONORA Setup
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-Windows-EXE
          path: spotify-premium-main/release/*.exe
          if-no-files-found: error
          retention-days: 14
