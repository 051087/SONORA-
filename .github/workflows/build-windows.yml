
name: Build SONORA Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Télécharger SONORA
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trouver automatiquement le projet
        id: project
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "." -Filter "package.json" -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\node_modules\\' -and
              $_.FullName -notmatch '\\.next\\'
            }

          if (!$files) {
            Write-Error "Aucun package.json trouvé dans le dépôt."
            exit 1
          }

          $project = $files |
            Where-Object {
              Test-Path (Join-Path $_.DirectoryName "next.config.js")
            } |
            Select-Object -First 1

          if (!$project) {
            Write-Error "Aucun projet Next.js trouvé."
            exit 1
          }

          $directory = $project.DirectoryName
          $relative = Resolve-Path -Relative $directory

          Write-Host "Projet trouvé : $relative"

          "PROJECT_DIR=$relative" >> $env:GITHUB_ENV

      - name: Vérifier la structure
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"

          if (!(Test-Path "package.json")) {
            Write-Error "package.json introuvable."
            exit 1
          }

          if (!(Test-Path "electron/main.cjs")) {
            Write-Error "electron/main.cjs introuvable."
            exit 1
          }

          Write-Host "Structure du projet validée."

      - name: Installer les dépendances
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Vérifier Electron
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm ls electron electron-builder

      - name: Construire Next.js
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Vérifier le serveur autonome
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"

          if (!(Test-Path ".next/standalone/server.js")) {
            Write-Error "Le serveur Next.js autonome est absent."
            exit 1
          }

      - name: Construire SONORA Windows
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npx electron-builder --win nsis --x64

      - name: Vérifier l'installateur
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"

          $installer = Get-ChildItem "release" -Filter "*.exe" -File

          if (!$installer) {
            Write-Error "Aucun installateur EXE n'a été généré."
            exit 1
          }

          $installer | ForEach-Object {
            Write-Host "Installateur : $($_.FullName)"
          }

      - name: Publier SONORA Setup
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-Windows-EXE
          path: ${{ env.PROJECT_DIR }}/release/*.exe
          if-no-files-found: error
          retention-days: 14
