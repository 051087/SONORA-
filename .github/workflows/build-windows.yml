
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Rechercher package.json
        id: detect
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' }

          if ($files.Count -eq 0) {
            Write-Error "Aucun package.json trouvé dans le dépôt."
            exit 1
          }

          $file = $files | Select-Object -First 1
          $dir = $file.Directory.FullName
          $relative = Resolve-Path $dir -Relative
          "project_dir=$relative" >> $env:GITHUB_OUTPUT

          Write-Host "Projet détecté : $relative"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: npm install

      - name: Compiler
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: npx electron-builder --win --x64

      - name: Récupérer les fichiers EXE
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-Windows
          path: |
            **/dist/*.exe
            **/release/*.exe
          if-no-files-found: warn
