
name: Build SONORA Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Télécharger SONORA
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Détecter le projet
        id: detect
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\node_modules\\' -and
              $_.FullName -notmatch '\\.git\\'
            }

          if ($files.Count -eq 0) {
            Write-Error "Aucun package.json trouvé."
            exit 1
          }

          Write-Host "Fichiers package.json trouvés :"
          $files | ForEach-Object { Write-Host $_.FullName }

          $file = $files | Select-Object -First 1
          $dir = $file.Directory.FullName
          $relative = Resolve-Path $dir -Relative

          "project_dir=$relative" >> $env:GITHUB_OUTPUT

          Write-Host "Projet sélectionné : $relative"

      - name: Installer les dépendances
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: npm install

      - name: Vérifier la configuration Electron
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json

          if (-not $package.devDependencies.electron -and
              -not $package.dependencies.electron) {
            Write-Error "Electron absent : ce projet nécessite une configuration desktop."
            exit 1
          }

          Write-Host "Electron détecté."

      - name: Compiler SONORA pour Windows
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: npx electron-builder --win --x64

      - name: Publier les fichiers EXE
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-Windows-EXE
          path: |
            **/dist/*.exe
            **/release/*.exe
            **/dist/**/*.exe
          if-no-files-found: error
